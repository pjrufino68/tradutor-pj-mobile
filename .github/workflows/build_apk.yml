name: Gerar APK Android 100% Offline (ML Kit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./android-app/gradlew

      - name: Compilar APK (Assemble Debug)
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: TradutorPJ-Android-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
